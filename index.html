<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title> Search app</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif; max-width: 800px;margin : 40px auto; padding: 0 20px;}
            input{ width: 100%; padding : 10px; font-size: 16px; border: 1px solid gray; border-radius: 4px;}
                .count{margin: 15px 0; color: #555 ; }
.article {margin-bottom: 30px;}
.article h2 {font-size: 20px;}
.article p {color: #444;}
mark {background-color: aquamarine; padding: 0;}
            



        </style>
    </head>
    <body>

        <h1>
            Search
        </h1>
    </body>

    <input type = "text" id="searchInput" placeholder="Serching ..."/>
    <div class="count" id="count"></div>
    <div id="results"></div>
    <script>
        const articles = [
            {
                title: "Understanding css grid template",
                date: "Oct 09, 2028",
                body: " with all the new properties related to css ..." 
            },
             {
                title: "Recreating github",
                date: "Sep 20, 2020",
                body: " with all the new properties related to css ..." 
            }
        ];
        function highlight(text,keyword){
            if(!keyword) return text;
            let regex = new RegExp(`(${keyword})`, "gi");
            return text.replace(regex, "<mark>$1</mark>");
        
        }
        function renderArticle(keyword){
            const results= document.getElementById("results");
            const count= document.getElementById("count");

            let filtered = articles.filter( a => 
                a.title.toLowerCase().includes(keyword.toLowerCase()) ||
                 a.body.toLowerCase().includes(keyword.toLowerCase())
            );

            count.textContent = keyword
            ? `${filtered.length} post(s) were found. `
            : "";

            results.innerHTML = filtered.map(a =>`
            <div class = "article">
                <h2>${highlight(a.title, keyword)} </h2>
                <p> <em>${a.date}</em></p>
                <p>${highlight(a.body,keyword)}</p>
            </div>
            `).join("");
            
        }
            document.getElementById("searchInput").addEventListener("input" , function(){
                renderArticles(this.value);
            });
            

    </script>
    </body>
</html>
